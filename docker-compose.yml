# Запуск: cp .env.example .env && docker compose up --build
# API:     http://localhost:8080   (OpenAPI — только в Development)
# Web:     http://localhost:8081
# Файлы видео хранятся в Docker volume; MinIO не требуется для локального запуска.
# Симуляторы добавляет участник 2.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-billboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-billboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Billboard.Api/Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-billboard};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Storage__Provider: Local
      Storage__LocalPath: /data/videos
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      DataProtection__KeysPath: /keys
    ports:
      - "8080:8080"
    volumes:
      - dpkeys:/keys
      - videodata:/data/videos

  web:
    build:
      context: .
      dockerfile: src/Billboard.Web/Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      BillboardApi__BaseUrl: http://api:8080/
      DataProtection__KeysPath: /keys
    ports:
      - "8081:8080"
    volumes:
      - webkeys:/keys

volumes:
  pgdata:
  videodata:
  dpkeys:
  webkeys:
