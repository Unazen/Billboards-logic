name: Build and test

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BillboardSystem.slnx

      - name: Build
        run: dotnet build BillboardSystem.slnx --no-restore

      - name: Test
        run: dotnet test BillboardSystem.slnx --no-build --verbosity normal
